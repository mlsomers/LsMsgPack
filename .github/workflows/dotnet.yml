# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build LsMsgPack.slnf --no-restore -c DEBUG
    - name: Test
      run: dotnet test LsMsgPack.slnf --no-build --verbosity normal -c DEBUG

  aot-smoke:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: NativeAOT smoke test of the source generator
      run: bash LtMsgPackAotSmokeTest/run.sh

  typescript-client:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build the test server (ASP.NET Core formatters) and lsmsgpack-ts
      run: |
        dotnet build clients/typescript/test-server -c Debug
        dotnet build LsMsgPackTypeScript -c Debug
    - name: Test the TypeScript client
      working-directory: clients/typescript
      env:
        LSMSGPACK_TS_REQUIRE_SERVER: 1 # the tests against the formatters and with generated models must not be skipped
      run: |
        npm ci
        npm test
